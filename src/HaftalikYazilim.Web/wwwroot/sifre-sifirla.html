<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n="title.reset">Şifremi unuttum — HaftalıkYazılım</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=2" />
  <link rel="stylesheet" href="assets/css/theme.css" />
  <link rel="stylesheet" href="assets/css/site.css" />
</head>
<body>
  <header id="site-header" class="site-header"></header>

  <main class="page">
    <div class="card stack" style="max-width: 420px; margin: var(--space-6) auto 0;">
      <h1 style="font-size: var(--fs-xl);" data-i18n="sifre.h1">Şifremi sıfırla</h1>

      <div id="reset-error" class="alert alert--error" hidden></div>

      <!-- 1) İstek formu -->
      <form id="reset-form" class="stack" novalidate>
        <div class="field">
          <label class="field__label" for="reset-id" data-i18n="sifre.idLabel">Kullanıcı adı veya e-posta</label>
          <input id="reset-id" class="input" type="text" autocomplete="username" required />
        </div>
        <button id="reset-submit" class="btn btn--primary" type="submit" data-i18n="sifre.submit">Şifremi sıfırla</button>
        <a class="backlink" href="giris.html" style="align-self:center" data-i18n="sifre.backToLogin">← Girişe dön</a>
      </form>

      <!-- 2) Sonuç: yeni şifre -->
      <div id="reset-result" class="stack" hidden>
        <p id="reset-message" class="mb-0"></p>
        <div class="new-password">
          <code id="new-password"></code>
          <button id="copy-password" class="btn btn--sm" type="button" data-i18n="sifre.copy">Kopyala</button>
        </div>
        <p class="field__hint" data-i18n="sifre.resultHint">Bu şifre bir daha gösterilmez. Kaydet, giriş yap, profilinden değiştir.</p>
        <a class="btn btn--primary" href="giris.html" data-i18n="sifre.loginBtn">Giriş yap</a>
      </div>
    </div>
  </main>

  <footer id="site-footer" class="site-footer"></footer>

  <script type="module" src="assets/js/pages/sifre-sifirla.js"></script>
</body>
</html>
