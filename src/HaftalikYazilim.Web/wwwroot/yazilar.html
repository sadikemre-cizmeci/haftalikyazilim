<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n="title.articles">Yazılar — HaftalıkYazılım</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=2" />
  <link rel="stylesheet" href="assets/css/theme.css" />
  <link rel="stylesheet" href="assets/css/site.css" />
</head>
<body>
  <header id="site-header" class="site-header"></header>

  <main class="page stack">

    <h1 data-i18n="yazilar.h1">Yazılar</h1>

    <!-- Bir yazarın yazılarına bakılıyorsa burada bilgi çıkar (assets/js/pages/yazilar.js). -->
    <p id="author-note" class="author-note" hidden></p>

    <!-- Tümü / Takip ettiklerim — sadece giriş yapınca görünür (JS açar). -->
    <div id="scope-toggle" class="segmented" hidden>
      <button type="button" data-scope="all" class="is-active" data-i18n="yazilar.scopeAll">Tümü</button>
      <button type="button" data-scope="following" data-i18n="yazilar.scopeFollowing">Takip ettiklerim</button>
    </div>

    <!-- Tek arama kutusu: başlıkta ve yazar adında arar. -->
    <input
      id="search-input"
      class="input"
      type="search"
      placeholder="Yazı başlığı veya yazar adı ara…"
      data-i18n-attr="placeholder:yazilar.searchPh"
      style="max-width: 380px;"
    />

    <p id="list-status" class="state" data-i18n="common.loading">Yükleniyor…</p>
    <ul id="article-list" class="article-list"></ul>

    <!-- Sayfa numaraları -->
    <nav id="pager" class="pager" aria-label="Sayfalar" data-i18n-attr="aria-label:yazilar.pagerLabel"></nav>

  </main>

  <footer id="site-footer" class="site-footer"></footer>

  <script type="module" src="assets/js/pages/yazilar.js"></script>
</body>
</html>
