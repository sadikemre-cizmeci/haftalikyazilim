<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n="title.admin">Yönetim — HaftalıkYazılım</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=2" />
  <link rel="stylesheet" href="assets/css/theme.css" />
  <link rel="stylesheet" href="assets/css/site.css" />
</head>
<body>
  <header id="site-header" class="site-header"></header>

  <main class="page stack">

    <div>
      <h1 class="mb-0" data-i18n="yonetim.h1">Yönetim</h1>
      <p class="muted mb-0 text-sm" data-i18n="yonetim.sub">İstatistikler, kullanıcılar ve tüm yazılar. (Salt-okunur)</p>
    </div>

    <!-- ================= İSTATİSTİKLER ================= -->
    <section class="stack">
      <div class="row row--between">
        <h2 class="mb-0" data-i18n="yonetim.statsTitle">İstatistik — ilk 10</h2>
        <div id="stats-range" class="segmented">
          <button type="button" data-days="1" data-i18n="yonetim.today">Bugün</button>
          <button type="button" data-days="7" class="is-active" data-i18n="yonetim.week">Bir hafta</button>
          <button type="button" data-days="30" data-i18n="yonetim.month">Bir ay</button>
        </div>
      </div>
      <div id="stats-grid" class="stats-grid"></div>
    </section>

    <!-- ================= KULLANICILAR ================= -->
    <section class="stack">
      <h2 class="mb-0" data-i18n="yonetim.usersTitle">Kullanıcılar</h2>
      <div id="admin-users"></div>
    </section>

    <!-- ================= TÜM YAZILAR (moderasyon) ================= -->
    <section class="stack">
      <div class="row row--between">
        <h2 class="mb-0" data-i18n="yonetim.allArticles">Tüm yazılar</h2>
        <label class="row text-sm" style="gap: var(--space-2);">
          <input id="include-deleted" type="checkbox" />
          <span data-i18n="yonetim.includeDeleted">Silinmişleri de göster</span>
        </label>
      </div>
      <div id="admin-articles"></div>
    </section>

  </main>

  <footer id="site-footer" class="site-footer"></footer>

  <script type="module" src="assets/js/pages/yonetim.js"></script>
</body>
</html>
