<?xml version="1.0" encoding="UTF-8"?>
<!--
  HaftalıkYazılım favicon'u.
  Navbar'daki logonun (assets/img/logo.svg) küçük boyda okunur, sade hâli:
  sıcak fildişi zemin üzerinde kırmızı fırça darbesi "açık daire" + iki damla.
  16-32 px'de net görünsün diye filtre / yüzlerce nokta YOK; tek yay + iki daire.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="7" fill="#faf7f0"/>
  <defs>
    <linearGradient id="hy-fav" x1="14%" y1="10%" x2="82%" y2="92%">
      <stop offset="0" stop-color="#b71c1c"/>
      <stop offset=".55" stop-color="#d92d2d"/>
      <stop offset="1" stop-color="#f0564a"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke="url(#hy-fav)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Ana halka: üstte açık; sol-üstten başlar, alttan dolanır, sağ-üstte biter -->
    <path d="M12.6 6.6A10 10 0 1 0 21 7.3" stroke-width="4.8"/>
    <!-- Kuru fırça ucunun içe kıvrılan incelen kuyruğu -->
    <path d="M21 7.3q2.1 .5 2.7 2.7" stroke-width="2"/>
  </g>
  <!-- Başlangıçtaki sıçrama damlaları -->
  <g fill="#c62828">
    <circle cx="11" cy="4.6" r="1.15"/>
    <circle cx="8.7" cy="7.1" r=".7"/>
  </g>
</svg>
