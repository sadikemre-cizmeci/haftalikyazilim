<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n="title.editProfile">Profilim — HaftalıkYazılım</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=2" />
  <link rel="stylesheet" href="assets/css/theme.css" />
  <link rel="stylesheet" href="assets/css/site.css" />
</head>
<body>
  <header id="site-header" class="site-header"></header>

  <main class="page">
    <div class="card stack" style="max-width: 640px; margin: 0 auto;">

      <a class="backlink" href="profilim.html" data-i18n="profilDuzenle.backToMine">← Yazılarım</a>
      <h1 class="mb-0" style="font-size: var(--fs-xl);" data-i18n="profilDuzenle.h1">Profilim</h1>

      <div id="profile-error" class="alert alert--error" hidden></div>

      <form id="profile-form" class="stack" novalidate>

        <!-- FOTOĞRAF -->
        <div class="field">
          <span class="field__label" data-i18n="profilDuzenle.photoLabel">Profil fotoğrafı</span>
          <div class="avatar-editor">
            <div id="avatar-preview" class="avatar avatar--lg"></div>
            <div class="stack" style="gap: var(--space-2); flex: 1;">
              <div class="row" style="gap: var(--space-2);">
                <label class="btn btn--sm" for="avatar-file" data-i18n="profilDuzenle.pickPhoto">Fotoğraf seç</label>
                <input id="avatar-file" type="file" accept="image/jpeg,image/png,image/webp" hidden />
                <button id="avatar-remove" class="btn btn--sm btn--ghost" type="button" data-i18n="profilDuzenle.removePhoto" hidden>Kaldır</button>
              </div>
            </div>
          </div>

          <!-- Boyut / konum ayarları (fotoğraf varken görünür) -->
          <div id="avatar-adjust" class="avatar-adjust" hidden>
            <label><span data-i18n="profilDuzenle.zoom">Yakınlaştır</span>
              <input id="adj-zoom" type="range" min="1" max="3" step="0.02" value="1" />
            </label>
            <label><span data-i18n="profilDuzenle.horizontal">Yatay</span>
              <input id="adj-x" type="range" min="0" max="100" step="1" value="50" />
            </label>
            <label><span data-i18n="profilDuzenle.vertical">Dikey</span>
              <input id="adj-y" type="range" min="0" max="100" step="1" value="50" />
            </label>
          </div>
        </div>

        <!-- E-POSTA (salt okunur) -->
        <div class="field">
          <span class="field__label" data-i18n="profilDuzenle.emailLabel">E-posta</span>
          <input id="email" class="input" type="email" readonly tabindex="-1" autocomplete="off" />
        </div>

        <!-- KULLANICI ADI -->
        <div class="field">
          <label class="field__label" for="username" data-i18n="profilDuzenle.usernameLabel">Kullanıcı adı</label>
          <input id="username" class="input" type="text" maxlength="30" autocomplete="username" required />
        </div>

        <!-- AD -->
        <div class="field">
          <label class="field__label" for="display-name" data-i18n="profilDuzenle.displayLabel">Görünen ad</label>
          <input id="display-name" class="input" type="text" maxlength="120" required />
        </div>

        <!-- KISA TANITIM -->
        <div class="field">
          <label class="field__label" for="bio" data-i18n="profilDuzenle.bioLabel">Kısa tanıtım</label>
          <textarea id="bio" class="textarea" rows="2" maxlength="2000"
            placeholder="Bir-iki cümle. ⓘ baloncuğunda ve profil başlığında görünür."
            data-i18n-attr="placeholder:profilDuzenle.bioPh"></textarea>
        </div>

        <!-- UZUN TANITIM -->
        <div class="field">
          <label class="field__label" for="about" data-i18n="profilDuzenle.aboutLabel">Hakkında</label>
          <textarea id="about" class="textarea" rows="7" maxlength="20000"
            placeholder="Profil sayfanda görünecek tam metin. Boş satır = paragraf."
            data-i18n-attr="placeholder:profilDuzenle.aboutPh"></textarea>
        </div>

        <button id="profile-submit" class="btn btn--primary" type="submit" data-i18n="common.save">Kaydet</button>
      </form>
    </div>
  </main>

  <footer id="site-footer" class="site-footer"></footer>

  <script type="module" src="assets/js/pages/profil-duzenle.js"></script>
</body>
</html>
