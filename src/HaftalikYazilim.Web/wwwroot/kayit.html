<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n="title.register">Kayıt ol — HaftalıkYazılım</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=2" />
  <link rel="stylesheet" href="assets/css/theme.css" />
  <link rel="stylesheet" href="assets/css/site.css" />
</head>
<body>
  <header id="site-header" class="site-header"></header>

  <main class="page">
    <div class="card stack" style="max-width: 420px; margin: var(--space-6) auto 0;">
      <h1 style="font-size: var(--fs-xl);" data-i18n="kayit.h1">Kayıt ol</h1>
      <p class="muted text-sm" data-i18n="kayit.lead">
        Hesap açınca yazı yayımlayabilir, yazarları takip edebilir, beğenip yorum yapabilirsin.
      </p>

      <div id="register-error" class="alert alert--error" hidden></div>

      <form id="register-form" class="stack" novalidate>
        <div class="field">
          <label class="field__label" for="reg-display" data-i18n="kayit.displayLabel">Görünen ad</label>
          <input id="reg-display" class="input" type="text" maxlength="120" autocomplete="name" required />
          <span class="field__hint" data-i18n="kayit.displayHint">Yazılarında ve profilinde görünür.</span>
        </div>
        <div class="field">
          <label class="field__label" for="reg-username" data-i18n="kayit.usernameLabel">Kullanıcı adı</label>
          <input id="reg-username" class="input" type="text" maxlength="30" autocomplete="username" required />
          <span id="reg-username-hint" class="field__hint" data-i18n="kayit.usernameHint">3–30 karakter; harf, rakam, nokta, alt çizgi. Giriş bununla da yapılır.</span>
        </div>
        <div class="field">
          <label class="field__label" for="reg-email" data-i18n="kayit.emailLabel">E-posta</label>
          <input id="reg-email" class="input" type="email" autocomplete="email" required />
        </div>
        <div class="field">
          <label class="field__label" for="reg-password" data-i18n="kayit.pwLabel">Şifre</label>
          <input id="reg-password" class="input" type="password" minlength="8" autocomplete="new-password" required />
          <span class="field__hint" data-i18n="kayit.pwHint">En az 8 karakter.</span>
        </div>
        <button id="register-submit" class="btn btn--primary" type="submit" data-i18n="kayit.submit">Hesap aç</button>
      </form>

      <p class="muted text-sm mb-0">
        <span data-i18n="kayit.haveAccount">Zaten hesabın var mı?</span> <a href="giris.html" data-i18n="kayit.loginLink">Giriş yap</a>
      </p>
    </div>
  </main>

  <footer id="site-footer" class="site-footer"></footer>

  <script type="module" src="assets/js/pages/kayit.js"></script>
</body>
</html>
