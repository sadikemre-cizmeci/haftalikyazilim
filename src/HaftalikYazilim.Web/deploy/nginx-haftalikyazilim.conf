# HaftalikYazilim — nginx ters vekil (reverse proxy)
# /etc/nginx/conf.d/haftalikyazilim.conf olarak kopyalanır.
# Certbot ilk çalıştığında bu dosyayı otomatik olarak 443 + yönlendirme ile günceller.

server {
    listen 80;
    listen [::]:80;
    server_name haftalikyazilim.com www.haftalikyazilim.com;

    # PDF yüklemeleri 50 MB'a kadar (uygulama sınırı). Varsayılan 1 MB → 413 verirdi.
    client_max_body_size 60m;

    gzip on;
    gzip_vary on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    location / {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection keep-alive;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
    }
}
